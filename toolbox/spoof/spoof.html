<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>你被骗了!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
            background: #000;
        }
        audio {
            display: none;
        }
    </style>
</head>
<body>

    <video id="video"
           muted
           autoplay
           playsinline
           webkit-playsinline
           x5-playsinline
           preload="auto"
           src="https://wldymg.github.io/toolbox/spoof/video.mp4">
    </video>

    <audio id="audio"
           preload="auto"
           src="https://wldymg.github.io/toolbox/spoof/audio.mp3">
    </audio>

    <script>
        (function() {
            var video = document.getElementById('video');
            var audio = document.getElementById('audio');
            var audioPlayed = false;

            function playAudio() {
                if (audioPlayed) return;
                audio.play().then(function() {
                    audioPlayed = true;
                }).catch(function() {
                    // 被浏览器阻止，等待用户手势
                });
            }

            // 视频真正开始播放时，立即播放音频（自动跟随）
            video.addEventListener('playing', playAudio);

            // 如果视频缓存足够但未触发 playing，也尝试
            video.addEventListener('canplaythrough', function() {
                if (video.currentTime > 0 && !audioPlayed) {
                    playAudio();
                }
            });

            // 手势：解锁视频自动播放（若被阻止），音频会在视频播放后自动响起
            function handleUserGesture() {
                if (video.paused) {
                    video.play().catch(function() {});
                } else {
                    // 如果视频已在播放但音频未播放（极少情况），利用手势解锁音频
                    playAudio();
                }
                document.removeEventListener('touchstart', handleUserGesture);
                document.removeEventListener('click', handleUserGesture);
            }

            document.addEventListener('touchstart', handleUserGesture, { passive: true });
            document.addEventListener('click', handleUserGesture, { passive: true });

            // 页面加载立即尝试播放视频（自动）
            video.play().catch(function() {});
        })();
    </script>

</body>
</html>
